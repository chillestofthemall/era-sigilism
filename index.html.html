/* ---------- product card ---------- */

function Swatch({ color, active, onClick }) {
  const style = color.hex2
    ? { background: `linear-gradient(90deg, ${color.hex} 50%, ${color.hex2} 50%)` }
    : { background: color.hex };
  return (
    <button
      className={"swatch" + (active ? " swatch--active" : "")}
      style={style}
      onClick={onClick}
      aria-pressed={active}
      aria-label={color.label}
      title={color.label}
    />
  );
}

function ProductCard({ product, expanded, onToggle, selection, onSelect, onAdd }) {
  const color = product.colors.find((c) => c.id === selection.color) || product.colors[0];
  const side = selection.side || "front";
  const canAdd = product.sizes ? !!selection.size : true;
  const img = photoKey(product.type, color.id, side);
  const displayName = `${product.name} \u2014 ${color.label}`;

  return (
    <div className={"card" + (expanded ? " card--open" : "")}>
      {!expanded && (
        <button className="card-face" onClick={onToggle} aria-expanded={false}>
          <div className="card-image-wrap">
            <span className="tag-badge">{product.tag}</span>
            <img src={photoKey(product.type, color.id, "front")} alt="" className="card-image" />
          </div>
          <div className="card-caption">
            <div className="card-name">{displayName}</div>
            <div className="card-sub">{color.label} / {color.sigilLabel}</div>
            <div className="card-bottom-row">
              <span className="card-price">{peso(product.price)}</span>
              <span className="tap-view">Tap to view</span>
            </div>
          </div>
        </button>
      )}

      {expanded && (
        <div className="details-panel">
          <div className="details-image-wrap">
            <button className="close-btn" onClick={onToggle} aria-label="Close">
              <CloseIcon />
            </button>
            <img src={img} alt="" className="details-image" />
            <div className="side-toggle">
              <button
                className={"side-btn" + (side === "front" ? " side-btn--active" : "")}
                onClick={() => onSelect({ side: "front" })}
              >
                Front
              </button>
              <button
                className={"side-btn" + (side === "back" ? " side-btn--active" : "")}
                onClick={() => onSelect({ side: "back" })}
              >
                Back
              </button>
            </div>
          </div>

          <div className="details-copy">
            <div className="details-tag">{product.tag}</div>
            <h3 className="details-name">{displayName}</h3>
            <div className="details-sub">{color.label} / {color.sigilLabel}</div>
            <p className="details-desc">{color.blurb} {product.material}</p>
            <div className="details-price">{peso(product.price)}</div>

            <div className="rule" />

            <div className="option-block">
              <span className="option-label">Color \u2014 {color.label}</span>
              <div className="swatch-row">
                {product.colors.map((c) => (
                  <Swatch
                    key={c.id}
                    color={c}
                    active={color.id === c.id}
                    onClick={() => onSelect({ color: c.id })}
                  />
                ))}
              </div>
            </div>

            <div className="rule" />

            {product.sizes ? (
              <div className="option-block">
                <span className="option-label">
                  Size{selection.size ? ` \u2014 ${selection.size}` : ""}
                </span>
                <div className="size-row">
                  {product.sizes.map((s) => (
                    <button
                      key={s}
                      className={"size-btn" + (selection.size === s ? " size-btn--active" : "")}
                      onClick={() => onSelect({ size: s })}
                      aria-pressed={selection.size === s}
                    >
                      {s}
                    </button>
                  ))}
                </div>
              </div>
            ) : (
              <div className="option-block">
                <span className="option-label">Size \u2014 one size, adjustable</span>
              </div>
            )}

            <div className="rule" />
            <p className="fine-print">{product.printNote}</p>

            <button
              className="btn btn-primary btn-full"
              disabled={!canAdd}
              onClick={() => onAdd(product, { color: color.id, size: selection.size })}
            >
              Add to cart
            </button>
            <button
              className="btn btn-ghost btn-full"
              disabled={!canAdd}
              onClick={() => onAdd(product, { color: color.id, size: selection.size }, true)}
            >
              Buy now
            </button>
            {!canAdd && <p className="option-hint">Pick a size to continue.</p>}
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- app ---------- */

function App() {
  const [page, setPage] = useState("home");
  const [expandedId, setExpandedId] = useState(null);
  const [selections, setSelections] = useState({});
  const [cart, setCart] = useState([]);
  const [menuOpen, setMenuOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  const getSelection = (id) => selections[id] || {};
  function setSelection(id, patch) {
    setSelections((s) => ({ ...s, [id]: { ...s[id], ...patch } }));
  }

  function showToast(msg) {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2600);
  }

  function addToCart(product, opts, isBuy) {
    const key = product.id + "|" + opts.color + "|" + (opts.size || "one-size");
    setCart((prev) => {
      const found = prev.find((i) => i.key === key);
      if (found) return prev.map((i) => (i.key === key ? { ...i, qty: i.qty + 1 } : i));
      const colorMeta = product.colors.find((c) => c.id === opts.color);
      return [
        ...prev,
        {
          key,
          name: `${product.name} \u2014 ${colorMeta.label}`,
          size: opts.size,
          price: product.price,
          qty: 1,
        },
      ];
    });
    showToast(isBuy ? "Checkout isn't wired up in this preview — added to cart instead." : `${product.name} added to cart.`);
  }

  function removeFromCart(key) {
    setCart((prev) => prev.filter((i) => i.key !== key));
  }

  const cartCount = cart.reduce((n, i) => n + i.qty, 0);
  const cartTotal = cart.reduce((n, i) => n + i.qty * i.price, 0);

  function goHome() {
    setPage("home");
    setMenuOpen(false);
  }
  function goCart() {
    setPage("cart");
    setMenuOpen(false);
  }
  function scrollToId(id) {
    setPage("home");
    setMenuOpen(false);
    requestAnimationFrame(() => {
      setTimeout(() => {
        document.getElementById(id)?.scrollIntoView({ behavior: "smooth" });
      }, 60);
    });
  }

  const categories = ["Shirts", "Hoodies", "Headwear"];

  return (
    <div className="site">
      <style>{CSS}</style>

      <header className="topbar">
        <div className="topbar-pill">
          <button className="brand-badge" onClick={goHome} aria-label="Era-Sigilism home">
            <img src={ICONS.logo_black} alt="" />
          </button>
          <div className="topbar-actions">
            <button className="icon-btn" onClick={goCart} aria-label={`Cart, ${cartCount} items`}>
              <BagIcon />
              {cartCount > 0 && <span className="icon-badge">{cartCount}</span>}
            </button>
            <button className="icon-btn" onClick={() => setMenuOpen((v) => !v)} aria-label="Menu">
              {menuOpen ? <CloseIcon /> : <MenuIcon />}
            </button>
          </div>
        </div>
      </header>

      {menuOpen && (
        <div className="nav-overlay">
          <button className="nav-link" onClick={() => scrollToId("collection")}>Collection</button>
          <button className="nav-link" onClick={() => scrollToId("about")}>About</button>
          <button className="nav-link" onClick={goCart}>Cart</button>
        </div>
      )}

      {page === "home" && (
        <>
          <section className="hero">
            <img src={ICONS.spire_black} alt="" className="hero-watermark" aria-hidden="true" />
            <p className="eyebrow">Cybersigilism &middot; Est. 2026 &middot; Philippines</p>
            <div className="wordmark">
              <h1 className="chrome">ERA-SIGILISM</h1>
              <svg className="wordmark-spikes" viewBox="0 0 1000 300" preserveAspectRatio="none" aria-hidden="true">
                <g fill="none" strokeLinecap="round">
                  <path d="M55,145 L38,14" stroke="#8a8478" strokeWidth="3" />
                  <path d="M55,145 L46,60 L64,60" stroke="#8a8478" strokeWidth="2" />
                  <path d="M150,150 L172,-8" stroke="#8a8478" strokeWidth="3" />
                  <path d="M262,150 L236,26" stroke="#8a8478" strokeWidth="3" />
                  <path d="M262,150 L252,70 L274,74" stroke="#8a8478" strokeWidth="2" />
                  <path d="M344,155 L362,268" stroke="#8a8478" strokeWidth="2.5" />
                  <path d="M431,148 L414,4" stroke="#8a8478" strokeWidth="3" />
                  <path d="M524,155 L546,272" stroke="#8a8478" strokeWidth="2.5" />
                  <path d="M614,148 L634,16" stroke="#8a8478" strokeWidth="3" />
                  <path d="M614,148 L602,66 L624,70" stroke="#8a8478" strokeWidth="2" />
                  <path d="M704,152 L684,24" stroke="#8a8478" strokeWidth="3" />
                  <path d="M793,155 L813,266" stroke="#8a8478" strokeWidth="2.5" />
                  <path d="M884,150 L862,-14" stroke="#8a8478" strokeWidth="3" />
                  <path d="M884,150 L896,64 L874,68" stroke="#8a8478" strokeWidth="2" />
                </g>
                <g fill="#8a8478">
                  <circle cx="172" cy="-8" r="4" />
                  <circle cx="414" cy="4" r="3.5" />
                  <circle cx="362" cy="268" r="3.5" />
                  <circle cx="546" cy="272" r="3.5" />
                  <circle cx="862" cy="-14" r="4" />
                </g>
              </svg>
            </div>
            <div className="hero-rule">
              <svg viewBox="0 0 120 14" preserveAspectRatio="none" aria-hidden="true">
                <path d="M0,7 L18,7 L24,1 L30,13 L36,3 L42,11 L48,7 L120,7"
                  fill="none" stroke="var(--line)" strokeWidth="1.4" />
              </svg>
            </div>
            <p className="hero-tagline">
              Clothing that makes you <em>transcend the grid.</em>
            </p>
            <div className="hero-actions">
              <button className="btn btn-primary" onClick={() => scrollToId("collection")}>Shop the sigil</button>
              <button className="btn btn-ghost" onClick={() => scrollToId("about")}>Our doctrine</button>
            </div>
            <div className="stats-row">
              <div className="stat"><span className="stat-num">2</span><span className="stat-label">Sigil marks</span></div>
              <div className="stat"><span className="stat-num">100%</span><span className="stat-label">Local made</span></div>
              <div className="stat"><span className="stat-num">&infin;</span><span className="stat-label">Iterations</span></div>
            </div>
            <div className="scroll-cue">
              <span className="scroll-label">Scroll</span>
              <span className="scroll-line" />
              <span className="scroll-dot" />
            </div>
          </section>

          <section className="about" id="about">
            <p className="eyebrow">The doctrine</p>
            <h2 className="doctrine-head">
              <span className="line-strong">Sigils are not decoration.</span>
              <span className="line-soft">They are code.</span>
            </h2>
            <p className="doctrine-copy">
              Era-Sigilism started where occult geometry meets interface design. Each
              mark is a working sigil &mdash; an intention compressed into line work and
              printed onto cloth. Wear it and you're carrying the frequency, not just
              the fabric.
            </p>
            <div className="feature-row">
              <div className="feature">
                <div className="feature-title">Organic cotton</div>
                <div className="feature-sub">Base material</div>
              </div>
              <div className="feature">
                <div className="feature-title">Print &amp; embroidery</div>
                <div className="feature-sub">Sigil application</div>
              </div>
              <div className="feature">
                <div className="feature-title">PH-made</div>
                <div className="feature-sub">Local craft</div>
              </div>
            </div>

            <p className="eyebrow application-eyebrow">Application</p>
            <div className="mark-card">
              <img src={ICONS.logo_black} alt="Compass sigil, the Era-Sigilism brand mark" />
            </div>
            <p className="mark-caption">The compass sigil &mdash; brand mark</p>
          </section>

          <main className="shop" id="collection">
            <p className="eyebrow">The collection</p>
            <h2 className="collection-head">Wear the sigil.</h2>

            {categories.map((cat) => (
              <section className="category" key={cat}>
                <div className="category-head">
                  <h3>{cat}</h3>
                  <span className="category-rule" />
                </div>
                <div className="grid">
                  {PRODUCTS.filter((p) => p.category === cat).map((product) => (
                    <ProductCard
                      key={product.id}
                      product={product}
                      expanded={expandedId === product.id}
                      onToggle={() => setExpandedId((id) => (id === product.id ? null : product.id))}
                      selection={getSelection(product.id)}
                      onSelect={(patch) => setSelection(product.id, patch)}
                      onAdd={addToCart}
                    />
                  ))}
                </div>
              </section>
            ))}
          </main>
        </>
      )}

      {page === "cart" && (
        <main className="cart-page">
          <p className="eyebrow">Your cart</p>
          <h2 className="cart-head">The sigil awaits.</h2>

          {cart.length === 0 ? (
            <>
              <p className="cart-empty-copy">Your cart is empty. Return to the collection and choose your mark.</p>
              <button className="btn btn-primary btn-full" onClick={() => scrollToId("collection")}>
                &larr; Back to collection
              </button>
            </>
          ) : (
            <>
              <ul className="cart-list-page">
                {cart.map((i) => (
                  <li key={i.key}>
                    <div>
                      <div className="cart-item-name">{i.name}</div>
                      <div className="cart-item-meta">{i.size ? `Size ${i.size} \u00b7 ` : ""}x{i.qty}</div>
                    </div>
                    <div className="cart-item-right">
                      <span>{peso(i.price * i.qty)}</span>
                      <button onClick={() => removeFromCart(i.key)} aria-label={"Remove " + i.name}>
                        <CloseIcon />
                      </button>
                    </div>
                  </li>
                ))}
              </ul>
              <div className="cart-total">
                <span>Subtotal</span>
                <span>{peso(cartTotal)}</span>
              </div>
              <button
                className="btn btn-primary btn-full"
                onClick={() => showToast("Checkout isn't wired up in this preview.")}
              >
                Checkout
              </button>
              <button className="btn btn-ghost btn-full" onClick={() => scrollToId("collection")}>
                &larr; Back to collection
              </button>
            </>
          )}
        </main>
      )}

      <footer className="site-footer">
        <button className="footer-brand" onClick={goHome}>
          <img src={ICONS.logo_black} alt="" />
          <span>Era-Sigilism</span>
        </button>
        <nav className="footer-nav">
          <button onClick={() => scrollToId("collection")}>Collection</button>
          <span>&middot;</span>
          <button onClick={() => scrollToId("about")}>About</button>
          <span>&middot;</span>
          <button onClick={goCart}>Cart</button>
        </nav>
        <p className="footer-fine">&copy; 2026 Era-Sigilism &middot; Privacy &middot; Terms</p>

        <div className="footer-credit">

      {toast && <div className="toast" role="status">{toast}</div>}

  margin-bottom:50px;
}
.category{ margin-top:50px; text-align:left; }
.category-head{ display:flex; align-items:center; gap:16px; margin-bottom:22px; }
.category-head h3{ font-size:20px; font-weight:600; }
.category-rule{ flex:1; height:1px; background:var(--line); }

.grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:26px; }
@media (max-width:920px){ .grid{grid-template-columns:repeat(2,1fr);} }
@media (max-width:600px){ .grid{grid-template-columns:1fr;} }

.card{
  grid-column:span 1; background:var(--bg-soft); border:1px solid var(--line); border-radius:22px;
  overflow:hidden; transition:box-shadow .25s ease;
}
.card:hover{ box-shadow:0 10px 26px rgba(23,21,15,0.12); }
.card--open{ grid-column:1 / -1; max-width:480px; margin:0 auto; }

.card-face{ all:unset; cursor:pointer; display:block; width:100%; }
.card-image-wrap{ position:relative; aspect-ratio:1/1; background:var(--bg-deep); overflow:hidden; }
.card-image{ width:100%; height:100%; object-fit:cover; }
.tag-badge{
  position:absolute; top:12px; left:12px; background:var(--bg-soft); border:1px solid var(--line);
  border-radius:999px; padding:4px 12px; font-size:11px; text-transform:uppercase; letter-spacing:0.08em;
}
.card-caption{ padding:16px 18px; border-top:1px solid var(--line); text-align:left; }
.card-name{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:16px; text-transform:uppercase; letter-spacing:0.02em; }
.card-sub{ color:var(--ink-soft); font-size:13px; margin-top:2px; }
.card-bottom-row{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
.card-price{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:18px; }
.tap-view{
  border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:11px;
  text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft);
}

.details-panel{ text-align:left; }
.details-image-wrap{ position:relative; aspect-ratio:1/1; background:var(--bg-deep); overflow:hidden; }
.details-image{ width:100%; height:100%; object-fit:cover; }
.close-btn{
  all:unset; cursor:pointer; position:absolute; top:14px; right:14px; width:34px; height:34px;
  border-radius:50%; background:var(--bg-soft); display:flex; align-items:center; justify-content:center;
}
.side-toggle{
  position:absolute; left:50%; bottom:-18px; transform:translateX(-50%); display:flex;
  background:var(--bg-soft); border:1px solid var(--line); border-radius:999px; padding:4px; gap:4px;
}
.side-btn{
  all:unset; cursor:pointer; padding:7px 18px; border-radius:999px; font-size:12px;
  text-transform:uppercase; letter-spacing:0.06em; color:var(--ink);
}
.side-btn--active{ background:var(--ink); color:var(--bg-soft); }

.details-copy{ padding:32px 24px 26px; }
.details-tag{ text-transform:uppercase; letter-spacing:0.1em; font-size:11px; color:var(--ink-soft); margin-bottom:6px; }
.details-name{ font-size:24px; font-weight:700; text-transform:uppercase; letter-spacing:0.01em; }
.details-sub{ color:var(--ink-soft); font-size:14px; margin-top:4px; }
.details-desc{ color:var(--ink-soft); font-size:14.5px; line-height:1.6; margin:18px 0; max-width:52ch; }
.details-price{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:28px; margin-bottom:6px; }

.rule{ height:1px; background:var(--line); margin:20px 0; }

.option-block{ display:flex; flex-direction:column; gap:10px; }
.option-label{ font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); }
.swatch-row{ display:flex; gap:10px; }
.swatch{ width:28px; height:28px; border-radius:50%; border:1px solid var(--line); cursor:pointer; padding:0; }
.swatch--active{ box-shadow:0 0 0 2px var(--bg-soft), 0 0 0 4px var(--ink); }

.size-row{ display:flex; gap:8px; flex-wrap:wrap; }
.size-btn{
  min-width:44px; padding:9px 10px; border-radius:999px; border:1px solid var(--line);
  background:transparent; color:var(--ink); cursor:pointer; font-size:13px;
}
.size-btn--active{ background:var(--ink); color:var(--bg-soft); border-color:var(--ink); }

.fine-print{ font-size:12.5px; color:var(--ink-soft); margin:0 0 20px; line-height:1.5; }
.option-hint{ margin:8px 0 0; font-size:12px; color:var(--ink-soft); }

/* cart page */
.cart-page{ max-width:520px; margin:0 auto; padding:100px 28px 80px; text-align:center; }
.cart-head{ font-size:clamp(30px,6vw,46px); font-weight:700; font-style:italic; text-transform:uppercase; margin-bottom:26px; }
.cart-empty-copy{ color:var(--ink-soft); font-size:15px; line-height:1.6; margin-bottom:26px; }
.cart-list-page{ list-style:none; margin:0 0 20px; padding:0; text-align:left; display:flex; flex-direction:column; gap:16px; }
.cart-list-page li{ display:flex; justify-content:space-between; gap:10px; padding-bottom:14px; border-bottom:1px solid var(--line); }
.cart-item-name{ font-weight:600; font-size:14px; }
.cart-item-meta{ color:var(--ink-soft); font-size:12.5px; margin-top:3px; }
.cart-item-right{ display:flex; align-items:center; gap:10px; }
.cart-item-right button{ all:unset; cursor:pointer; color:var(--ink-soft); display:flex; }
.cart-total{ display:flex; justify-content:space-between; font-weight:700; font-size:16px; margin-bottom:20px; }

/* footer */
.site-footer{ text-align:center; padding:70px 20px 50px; border-top:1px solid var(--line); margin-top:40px; }
.footer-brand{
  all:unset; cursor:pointer; display:flex; align-items:center; gap:10px; justify-content:center;
  font-family:'Rajdhani',sans-serif; font-weight:600; font-size:15px; letter-spacing:0.04em;
  text-transform:uppercase; margin-bottom:18px;
}
.footer-brand img{ width:22px; height:22px; object-fit:contain; }
.footer-nav{ display:flex; gap:10px; justify-content:center; margin-bottom:16px; color:var(--ink-soft); font-size:13px; }
.footer-nav button{ all:unset; cursor:pointer; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); }
.footer-nav button:hover{ color:var(--ink); }
.footer-fine{ font-size:12px; color:var(--ink-soft); opacity:0.85; margin:0; }
.footer-credit{ margin-top:34px; padding-top:26px; border-top:1px solid var(--line); }
.footer-credit-line{ font-size:12.5px; color:var(--ink-soft); margin:0 0 14px; letter-spacing:0.02em; }
.footer-credit-label{ text-transform:uppercase; letter-spacing:0.14em; font-size:10.5px; color:var(--ink-soft); opacity:0.7; margin:0 0 8px; }
.footer-founders{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--ink-soft); }

.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--ink); color:var(--bg-soft);
  padding:12px 20px; border-radius:999px; font-size:13.5px; box-shadow:0 10px 24px rgba(23,21,15,0.25); z-index:40;
  max-width:86vw; text-align:center;
}
`;


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
